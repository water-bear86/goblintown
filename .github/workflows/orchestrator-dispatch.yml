name: Production Dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dispatch_url:
        description: "Override for the dispatch endpoint (without trailing slash)."
        required: false

concurrency:
  group: goblintown-production-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    name: Trigger ChatGPT App dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve dispatch endpoint
        id: resolve
        env:
          INPUT_URL: ${{ github.event.inputs.dispatch_url }}
          REPO_VAR_URL: ${{ vars.ORCHESTRATOR_DISPATCH_URL }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_URL:-}" ]; then
            RAW_URL="${INPUT_URL}"
          elif [ -n "${REPO_VAR_URL:-}" ]; then
            RAW_URL="${REPO_VAR_URL}"
          else
            RAW_URL="https://goblintown-mcp.vercel.app"
          fi

          RAW_URL="${RAW_URL%/}"
          if [[ "$RAW_URL" == *"/api/cron/dispatch"* ]]; then
            DISPATCH_URL="$RAW_URL"
          else
            DISPATCH_URL="${RAW_URL}/api/cron/dispatch"
          fi

          echo "dispatch_url=$DISPATCH_URL" >> "$GITHUB_OUTPUT"

      - name: Trigger orchestrator dispatch
        id: call
        env:
          DISPATCH_URL: ${{ steps.resolve.outputs.dispatch_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET"
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "$DISPATCH_URL")"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Dispatch endpoint returned HTTP $HTTP_CODE"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          node - "$RESPONSE_FILE" <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[1];
          const raw = fs.readFileSync(path, "utf8");
          const data = JSON.parse(raw);
          if (!data?.ok) {
            console.error("Dispatch response indicates failure:", raw);
            process.exit(1);
          }
          const lines = [
            `runId: ${data.runId ?? "n/a"}`,
            `scannedOpen: ${data.scannedOpen ?? 0}`,
            `assigned: ${data.assigned ?? 0}`,
            `skipped: ${data.skipped ?? 0}`,
            `errors: ${data.errors ?? 0}`,
          ];
          console.log(lines.join("\n"));
          NODE

          echo "response<<'EOF'" >> "$GITHUB_OUTPUT"
          cat "$RESPONSE_FILE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Summarize run
        if: always()
        run: |
          echo "Dispatch URL: ${{ steps.resolve.outputs.dispatch_url }}"
          echo "Response:"
          echo "${{ steps.call.outputs.response }}"
